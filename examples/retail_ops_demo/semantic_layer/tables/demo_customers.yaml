    label: customer created date
    source_column: created_date
    data_type: date
    operations:
      - include_filter
      - exclude_filter
      - range_filter
  - field_id: customer_segment
    label: customer segment
    source_column: customer_segment
    data_type: string
    operations:
      - group_by
      - include_filter
      - exclude_filter
  - field_id: customer_region
    label: customer region
    source_column: customer_region
    data_type: string
    operations:
      - group_by
      - include_filter
      - exclude_filter
  - field_id: loyalty_tier
    label: loyalty tier
    source_column: loyalty_tier
    data_type: string
    operations:
      - group_by
      - include_filter
      - exclude_filter
  - field_id: acquisition_channel
    label: acquisition channel
    source_column: acquisition_channel
    data_type: string
    operations:
      - group_by
      - include_filter
      - exclude_filter
