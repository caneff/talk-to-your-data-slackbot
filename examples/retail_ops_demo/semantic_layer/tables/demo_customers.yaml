table_id: demo_customers
dataset_id: retail_ops
description: Synthetic retail customer profiles with segment, loyalty, and acquisition attributes.
columns:
  - column_id: customer_id
    data_type: string
    semantic_role: identifier
  - column_id: created_date
    data_type: date
  - column_id: customer_segment
    data_type: string
    semantic_role: dimension
  - column_id: customer_region
    data_type: string
    semantic_role: dimension
  - column_id: loyalty_tier
    data_type: string
    semantic_role: dimension
  - column_id: acquisition_channel
    data_type: string
    semantic_role: dimension
metrics:
  - metric_id: customer_count
    label: customer count
    expression: count(customer_id)
    source_column: customer_id
    kind: count
fields:
