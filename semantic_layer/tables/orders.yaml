table_id: orders
dataset_id: commerce
description: Clean commerce order facts.
date_column: order_date
columns:
  - column_id: order_date
    data_type: date
  - column_id: region
    data_type: string
    semantic_role: dimension
  - column_id: revenue
    data_type: decimal
    semantic_role: measure
metrics:
  - metric_id: total_revenue
    label: total revenue
    expression: sum(revenue)
    source_column: revenue
fields:
  - field_id: order_date
    label: order date
    source_column: order_date
    data_type: date
    operations:
      - include_filter
      - exclude_filter
      - range_filter
  - field_id: region
    label: region
    source_column: region
    data_type: string
    operations:
      - group_by
      - include_filter
      - exclude_filter
