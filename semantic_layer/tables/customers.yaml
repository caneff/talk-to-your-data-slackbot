table_id: customers
dataset_id: commerce
description: Clean commerce customer metadata.
date_column: created_date
columns:
  - column_id: created_date
    data_type: date
  - column_id: customer_id
    data_type: string
    semantic_role: identifier
  - column_id: customer_region
    data_type: string
    semantic_role: dimension
metrics:
  - metric_id: customer_count
    label: customer count
    expression: count(customer_id)
    source_column: customer_id
fields:
  - field_id: created_date
    label: created date
    source_column: created_date
    data_type: date
    operations:
      - include_filter
      - exclude_filter
      - range_filter
  - field_id: customer_region
    label: customer region
    source_column: customer_region
    data_type: string
    operations:
      - group_by
      - include_filter
      - exclude_filter
