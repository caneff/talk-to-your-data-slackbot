[project]
name = "talk-to-your-data-slackbot"
version = "0.1.0"
description = "A Slackbot for talking to your data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.3",
    "openai>=2.38.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.28.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"src/data_assistant/prompts/question_interpreter_developer.md" = "data_assistant/prompts/question_interpreter_developer.md"
"src/data_assistant/prompts/reasoning_layer_developer.md" = "data_assistant/prompts/reasoning_layer_developer.md"

[tool.pytest.ini_options]
testpaths = ["src", "scripts"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "scripts"]
extraPaths = ["src", "."]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.0.260204",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
